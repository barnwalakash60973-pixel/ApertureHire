name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # None of these three scripts call a real LLM (see their docstrings) -
      # they stub/skip the LLM step, so no API keys are needed here. Each
      # now exits non-zero on a failed check, so a broken pipeline actually
      # fails this job instead of silently printing "FAILURES: [...]".
      - run: python decision_test.py
      - run: python logic_test.py
      - run: python smoke_test.py

  backend-docker-build:
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t reviewer-backend:ci backend

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Render already redeploys automatically on push to main if the backend
  # service is connected to this repo - this job is only needed if you'd
  # rather trigger it explicitly via a deploy hook (Render dashboard ->
  # service -> Settings -> Deploy Hook) stored as the RENDER_DEPLOY_HOOK_URL
  # repo secret. Safe to leave the secret unset: the step just skips.
  #
  # The frontend needs no equivalent job: Vercel's own GitHub integration
  # builds and deploys on every push to main (and gives PR preview deploys
  # for free) once the repo is imported in the Vercel dashboard.
  deploy-backend:
    runs-on: ubuntu-latest
    needs: [backend-test, backend-docker-build, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set - skipping (Render's own git integration may already be deploying this push)."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
